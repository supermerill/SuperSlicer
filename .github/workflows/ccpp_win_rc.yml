name: C/C++ Release candidate windows x64

on:
  push:
    branches:
      - rc
      - debug_win
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign this release build (requires SIGNPATH_ENABLED and production policy)'
        type: boolean
        default: false

env:
  # Automatic signing is limited to pushes to rc; debug_win never signs automatically.
  SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/rc') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'true' || 'false' }}
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'superslicer' }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

jobs:
  build_dep:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - name: check signing configuration
      if: env.SIGNPATH_ENABLED == 'true'
      shell: powershell
      env:
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      run: |
        foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
                            'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_API_TOKEN')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing $name. See .github/signpath/README.md."
          }
        }
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: "5.42"
        distribution: strawberry
    - name: mkdir in deps
      run: mkdir deps/build
    - name: dep cache
      id: cache-action
      uses: actions/cache@v4
      with:
        key: win_2.7.63
        path: deps/build/destdir
    - if: steps.cache-action.outputs.cache-hit != 'true'
      name: build deps if new cache
      working-directory: ./deps/build
      run: |
        cmake .. -G "Visual Studio 17 2022" -A x64
        msbuild /m ALL_BUILD.vcxproj

  build:
    runs-on: windows-2022
    needs: build_dep
    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - name: update submodule profiles
      working-directory: ./resources/profiles
      run: git submodule update --init
    - uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: "5.42"
        distribution: strawberry
    - name: change date in version
      shell: powershell
      run: |
        copy version.inc version.date.inc
        (Get-Content version.date.inc) | Foreach-Object {$_ -replace "\+UNKNOWN", ("")} | Set-Content version.date.inc
    - name: dep cache
      id: cache-action
      uses: actions/cache@v4
      with:
        key: win_2.7.63
        path: deps/build/destdir
    - run: dir deps
    - run: dir deps/build
    - run: dir deps/build/destdir
    - run: dir deps/build/destdir/usr
    - run: mkdir msgfmt_bin
    - name: copy gettext
      working-directory: ./msgfmt_bin
      shell: powershell
      run: '(new-object System.Net.WebClient).DownloadFile("https://github.com/supermerill/SuperSlicer_deps/releases/download/gettext/gettext-tools-static-0.18.1.1.zip", "gettext.zip")'
    - name: unzip
      working-directory: ./msgfmt_bin
      shell: cmd
      run: '"C:/Program Files/7-Zip/7z.exe" x gettext.zip'
    - name: add msgfmt to path
      shell: powershell
      working-directory: msgfmt_bin
      run: echo "$pwd;" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - run: mkdir build
    - name: cmake
      working-directory: ./build
      run: cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="d:\a\${{ github.event.repository.name }}\${{ github.event.repository.name }}\deps\build\destdir\usr\local"
    - name: make
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release INSTALL.vcxproj
    - name: make .mo
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release gettext_po_to_mo.vcxproj
    - name: make .pot
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release gettext_make_pot.vcxproj
    - name: create OCCT wrapper
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release src\occt_wrapper\OCCTWrapper.vcxproj
    - name: copy dll
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release src\slic3rDllsCopy.vcxproj
    - name: create package directory
      working-directory: ./build
      shell: powershell
      run: mkdir package
    - name: copy from release
      working-directory: ./build
      shell: powershell
      run: '(new-object System.Net.WebClient).DownloadFile("https://github.com/supermerill/SuperSlicer_deps/releases/download/1.8/Slic3r_win_build.zip", "Slic3r_win_build.zip")'
    - name: unzip
      working-directory: ./build
      shell: cmd
      run: '"C:/Program Files/7-Zip/7z.exe" x Slic3r_win_build.zip'
    - name: copy missing dll content from old release
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE Slic3r_win_build\local-settings.bat package\${{ github.event.repository.name }}_local-settings.bat
        xcopy /RCYIE Slic3r_win_build\mesa package\mesa\
    - name: copy new resources
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE ..\resources package\resources
        del /S /Q package\resources\localization\*.so
    - name: copy profiles from registered github repositories
      working-directory: ./build
      shell: cmd
      run: |
        python ..\src\platform\download_vendor_bundles.py package/resources
    - name: copy dll & exe
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE src\release\*.dll package\
        xcopy /RCYIE src\release\*.exe package\
    - name: copy required VC runtimes
      shell: powershell
      run: ./.github/windows/Copy-VcRuntime.ps1 -PackageDirectory build/package
#    - name: create zip
#      working-directory: ./build
#      shell: cmd
#      run: '"C:/Program Files/7-Zip/7z.exe" a -tzip nightly.zip *'

    - name: collect own binaries to sign
      id: signing-input
      if: env.SIGNPATH_ENABLED == 'true'
      shell: powershell
      run: |
        ./.github/signpath/Prepare-Binaries.ps1 -SourceDirectory build/src/Release -OutputDirectory build/sign-input

    - name: upload unsigned binaries
      id: upload-unsigned-binaries
      if: env.SIGNPATH_ENABLED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-binaries-${{ github.run_attempt }}
        path: build/sign-input/
        if-no-files-found: error
        retention-days: 1

    - name: sign binaries
      if: env.SIGNPATH_ENABLED == 'true'
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-binaries
        github-artifact-id: ${{ steps.upload-unsigned-binaries.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: build/signed-binaries
        parameters: |
          version: ${{ toJSON(steps.signing-input.outputs.product-version) }}

    - name: verify and copy signed binaries into package
      if: env.SIGNPATH_ENABLED == 'true'
      shell: powershell
      run: |
        ./.github/signpath/Update-SignedArtifacts.ps1 -UnsignedDirectory build/sign-input -SignedDirectory build/signed-binaries -DestinationDirectory build/package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc_${{ github.event.repository.name }}-win64
        path: build/package/
        overwrite: true

# MSI CREATION (need files from the slic3r build, can't be its own step)
  # create_msi:
    # runs-on: windows-2022
    # needs: build

    # steps:
    # - uses: actions/checkout@v3
    # - name: Download build artifact
      # uses: actions/download-artifact@v4
      # with:
        # name: rc_win64
        # path: build/package
    - name: Check inside of 'build'
      working-directory: ./build
      run: dir
    - name: Install WiX Toolset
      run: choco install wixtoolset -y
    - name: Prepare license file for MSI
      shell: powershell
      working-directory: ./build
      run: |
        # Convert LICENSE to RTF format for WiX installer
        $licenseContent = Get-Content ..\LICENSE -Raw
        $rtfContent = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Times New Roman;}}{\f0\fs20 " + $licenseContent.Replace('\', '\\').Replace("`n", "\par ") + "}}"
        $rtfContent | Out-File -FilePath "package\LICENSE.rtf" -Encoding ASCII
    - name: Harvest files for MSI
      shell: cmd
      working-directory: ./build
      run: |
        heat.exe dir package -dr INSTALLFOLDER -cg Package -gg -sreg -srd -var var.SourceDir -out files.wxs -sfrag
    - name: Generate installer version
      shell: powershell
      run: |
        $fullVersion = (Get-Content version.inc | Select-String -Pattern 'set\(SLIC3R_RC_VERSION_DOTS \"(.*?)\"\)' | ForEach-Object { $_.Matches.Groups[1].Value })
        $env:InstallerVersion = "$fullVersion" -replace '\.[0-9]([+-].+)?', '.0'
        echo "InstallerVersion=$env:InstallerVersion" >> $env:GITHUB_ENV
        $env:ReleaseSuffix = ""
        echo "ReleaseSuffix=$env:ReleaseSuffix" >> $env:GITHUB_ENV
    - name: Check version number is not empty
      shell: powershell
      run: |
        if ([string]::IsNullOrWhiteSpace($env:InstallerVersion)) {
          Write-Warning "InstallerVersion is empty or null. Setting default version to 0.0.0.0"
          $env:InstallerVersion = "0.0.0.0"
          echo "InstallerVersion=$env:InstallerVersion" >> $env:GITHUB_ENV
        }
        Write-Host "Version validation passed: $env:InstallerVersion"
    - name: Build MSI installer
      shell: cmd
      working-directory: ./build
      run: |
        set MSIFileName=${{ github.event.repository.name }}_%InstallerVersion%.msi
        candle.exe -dSourceDir="package" -dInstallerVersion="%InstallerVersion%" -dReleaseSuffix="%ReleaseSuffix%" src\winInstaller.wxs files.wxs
        light.exe -b package -ext WixUIExtension winInstaller.wixobj files.wixobj -o %MSIFileName% -sw1076
    - run: dir ./build

    - name: collect unsigned msi
      if: env.SIGNPATH_ENABLED == 'true'
      shell: powershell
      env:
        MSI_FILE_NAME: ${{ github.event.repository.name }}_${{ env.InstallerVersion }}.msi
      run: |
        New-Item -ItemType Directory -Path build/sign-msi-input | Out-Null
        Copy-Item -LiteralPath "build/$env:MSI_FILE_NAME" -Destination build/sign-msi-input -ErrorAction Stop

    - name: upload unsigned msi
      id: upload-unsigned-msi
      if: env.SIGNPATH_ENABLED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-msi-${{ github.run_attempt }}
        path: build/sign-msi-input/
        if-no-files-found: error
        retention-days: 1

    - name: sign msi
      if: env.SIGNPATH_ENABLED == 'true'
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-msi
        github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: build/signed-msi

    - name: verify and replace signed msi
      if: env.SIGNPATH_ENABLED == 'true'
      shell: powershell
      run: |
        ./.github/signpath/Update-SignedArtifacts.ps1 -UnsignedDirectory build/sign-msi-input -SignedDirectory build/signed-msi -DestinationDirectory build

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc_${{ github.event.repository.name }}-win64.msi
        path: build/${{ github.event.repository.name }}_${{ env.InstallerVersion }}.msi
        overwrite: true

