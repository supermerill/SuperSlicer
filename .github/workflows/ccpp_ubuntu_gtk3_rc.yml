name: C/C++ Release candidate ubuntu-GTK3

on:
  workflow_dispatch:
  # Called by ci_rc.yml (branch rc, no release files) and release_rc.yml (version tag,
  # stage_release). Publication to the draft is done by release_rc.yml, not here.
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      stage_release:
        description: Stage the release files and their manifest for the draft publisher
        type: boolean
        default: false
      product:
        description: Release product name, required with stage_release
        type: string
        default: ''
      release_version:
        description: Full release version, required with stage_release
        type: string
        default: ''
    outputs:
      release_artifact_id:
        description: ID of the staged release files (empty unless stage_release)
        value: ${{ jobs.build.outputs.release_artifact_id }}

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04
    outputs:
      release_artifact_id: ${{ steps.release-artifact.outputs.artifact-id }}

    env:
      EXEC_NAME: "${{ github.event.repository.name }}"
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.16.x'
    - name: update clock
      run: sudo hwclock -s
    - name: update apt
      run: sudo apt update
    - name: install gtk3
      run: sudo apt install libgtk-3-dev
    - name: install libs
      run: sudo ./BuildLinux.sh -u
    - name: dep cache
      id: cache-action
      uses: actions/cache@v4
      with:
        key: ubu_gtk3_2.7.63
        path: deps/build/destdir
    - if: steps.cache-action.outputs.cache-hit != 'true'
      name: build deps if new cache
      run: ./BuildLinux.sh -d
    - name: slicer, tar & appimage
      run: ./BuildLinux.sh -si
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc_${{ github.event.repository.name }}-linux-x64-GTK3.tgz
        path: build/${{ github.event.repository.name }}-linux-x64-GTK3.tgz
        if-no-files-found: error
        overwrite: true
    - name: Upload appimage
      uses: actions/upload-artifact@v4
      with:
        name: rc_${{ github.event.repository.name }}-linux-x64-GTK3.AppImage
        path: build/${{ github.event.repository.name }}-linux-x64-GTK3.AppImage
        if-no-files-found: error
        overwrite: true
    - name: Stage named release files and integrity manifest
      if: inputs.stage_release
      env:
        RELEASE_SHA: ${{ inputs.source_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        PRODUCT: ${{ inputs.product }}
      run: >-
        python3 .github/scripts/release.py stage --platform linux-gtk3
        --source-sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --product "$PRODUCT"
    - name: Upload exact files for the draft publisher
      id: release-artifact
      if: inputs.stage_release
      uses: actions/upload-artifact@v4
      with:
        name: release-linux-gtk3-${{ github.run_attempt }}
        path: release-assets/
        if-no-files-found: error
