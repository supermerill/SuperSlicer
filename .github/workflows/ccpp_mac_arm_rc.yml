name: C/C++ Release candidate arm macos

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true
      release_id:
        type: string
        required: true
      product:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build_dep:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: New cmake
      run: cmake --version
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: "3.31.x"
    - name: Use cmake
      run: cmake --version
    - name: Install Autoconf
      run: |
        brew update
        brew install autoconf
    - name: check autoconf version
      run: autoconf --version
    - name: update automake for mpfr
      run: |
        curl -O -L https://github.com/supermerill/SuperSlicer_deps/releases/download/automake/automake-1.16.5.tar.gz
        tar -xzf automake-1.16.5.tar.gz
        cd automake-*
        ./configure
        make
        sudo make install
        automake --version
    - name: mkdir in deps
      run: mkdir deps/build
    - name: dep cache
      id: cache-action
      uses: actions/cache@v4
      with:
        key: macos_arm_2.7.63
        path: deps/build/destdir
    - if: steps.cache-action.outputs.cache-hit != 'true'
      name: build deps if new cache
      run: ./BuildMacOS.sh -ad

  build:
    runs-on: macos-15
    needs: build_dep
    outputs:
      release_artifact_id: ${{ steps.release-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: New cmake
      run: cmake --version
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: "3.31.x"
    - name: Use cmake
      run: cmake --version
    - name: dep cache
      id: cache-action
      uses: actions/cache@v4
      with:
        key: macos_arm_2.7.63
        path: deps/build/destdir
    - name: build slicer
      run: ./BuildMacOS.sh -asi
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc_${{ github.event.repository.name }}-macOS-arm.dmg
        path: build/${{ github.event.repository.name }}-macOS-arm.dmg
        if-no-files-found: error
        overwrite: true
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc_${{ github.event.repository.name }}-macOS-arm.tgz
        path: build/${{ github.event.repository.name }}-macOS-arm.tgz
        if-no-files-found: error
        overwrite: true
    - name: Stage named release files and integrity manifest
      if: inputs.release_id != ''
      env:
        RELEASE_SHA: ${{ inputs.source_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        PRODUCT: ${{ inputs.product }}
      run: >-
        python3 .github/scripts/release.py stage --platform macos-arm
        --source-sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --product "$PRODUCT"
    - name: Upload exact files for the draft publisher
      id: release-artifact
      if: inputs.release_id != ''
      uses: actions/upload-artifact@v4
      with:
        name: release-macos-arm-${{ github.run_attempt }}
        path: release-assets/
        if-no-files-found: error

  publish:
    needs: build
    if: inputs.release_id != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release_upload.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      release_version: ${{ inputs.release_version }}
      release_id: ${{ inputs.release_id }}
      product: ${{ inputs.product }}
      platform: macos-arm
      artifact_id: ${{ needs.build.outputs.release_artifact_id }}
