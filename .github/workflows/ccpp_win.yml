name: C/C++ Nightly windows x64

on:
  push:
    branches:
      - Nigthly
      - nightly_dev
      - nightly_2.7.62
      - nightly_master
      - nightly_2.7.63
      - debug_win
      - nightly_win
  workflow_dispatch:
    inputs:
      sign:
        description: 'Test SignPath signing (two requests; requires test policy and certificate pin)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # SignPath code signing - see .github/signpath/README.md
  # Test signing requires an explicit manual dispatch; ordinary nightly pushes never sign.
  SIGNPATH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign && 'true' || 'false' }}

# Same jobs as the RC: dependencies and compilation (windows_build.yml), then signing
# and packaging (windows_package.yml) from that exact artifact. No release publication.
jobs:
  signing:
    name: Signing mode
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
    - name: check signing configuration
      if: env.SIGNPATH_ENABLED == 'true'
      env:
        SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'superslicer' }}
        SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
        SIGNPATH_TEST_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_TEST_CERTIFICATE_THUMBPRINT }}
        # Only whether the secret is set; its value is not given to this job.
        SIGNPATH_API_TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      run: |
        for name in SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_TEST_CERTIFICATE_THUMBPRINT; do
          value="${!name}"
          if [ -z "${value//[[:space:]]/}" ]; then echo "::error::Missing $name. See .github/signpath/README.md."; exit 1; fi
        done
        if [ "$SIGNPATH_API_TOKEN_SET" != 'true' ]; then echo '::error::Missing SIGNPATH_API_TOKEN. See .github/signpath/README.md.'; exit 1; fi
        if ! [[ "${SIGNPATH_TEST_CERTIFICATE_THUMBPRINT//[[:space:]]/}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo '::error::SIGNPATH_TEST_CERTIFICATE_THUMBPRINT must be the SHA-1 thumbprint of the test certificate.'; exit 1
        fi
    - name: Select the signing mode
      id: mode
      run: echo "mode=$([ "$SIGNPATH_ENABLED" = 'true' ] && echo test || echo none)" >> "$GITHUB_OUTPUT"

  build:
    needs: signing
    uses: ./.github/workflows/windows_build.yml
    with:
      source_sha: ${{ github.sha }}
      mode: nightly

  package:
    needs: [signing, build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows_package.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      source_sha: ${{ github.sha }}
      mode: nightly
      signing: ${{ needs.signing.outputs.mode }}
    secrets:
      # Unsigned packaging does not receive the SignPath token at all.
      SIGNPATH_API_TOKEN: ${{ needs.signing.outputs.mode == 'test' && secrets.SIGNPATH_API_TOKEN || '' }}
